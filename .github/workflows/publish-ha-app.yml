name: Publish Home Assistant App

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "layerv_demo_display/**"
      - ".github/workflows/publish-ha-app.yml"

permissions:
  contents: read
  packages: write

jobs:
  build-aarch64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Read App version
        id: app
        shell: bash
        run: |
          version="$(sed -n 's/^version: "\([^"]*\)"/\1/p' layerv_demo_display/config.yaml)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: layerv_demo_display
          platforms: linux/arm64
          push: true
          build-args: |
            BUILD_ARCH=aarch64
            BUILD_VERSION=${{ steps.app.outputs.version }}
          tags: ghcr.io/runboyxyz/layer-v-demo-display:${{ steps.app.outputs.version }}
