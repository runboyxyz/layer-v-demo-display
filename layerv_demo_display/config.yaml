name: LayerV Demo Display
version: "0.7.0"
slug: layerv_demo_display
description: DEVELOPMENT TOOL - remotely show rendered dashboard pixels during LayerV demonstrations
url: https://github.com/runboyxyz/layer-v-demo-display
image: ghcr.io/runboyxyz/layer-v-demo-display
arch:
  - aarch64
startup: application
boot: auto
init: false
stage: experimental
apparmor: true
ingress: true
ingress_port: 8099
ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: Token-protected read-only Demo Display
panel_admin: true
panel_icon: mdi:monitor-eye
panel_title: Demo Display
homeassistant_api: true
hassio_role: default
tmpfs: true
options:
  dashboard_path: /demo-home/home
  resolution: 1920x1080
  capture_interval: 1
  default_session_duration: 60
  hide_ha_sidebar: true
  hide_ha_header: true
schema:
  dashboard_path: str
  resolution: list(1280x720|1920x1080)
  capture_interval: int(1,10)
  default_session_duration: int(15,120)
  hide_ha_sidebar: bool
  hide_ha_header: bool
